name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -e ".[dev]" torch --extra-index-url https://download.pytorch.org/whl/cpu
      - run: ruff check src tests
      - run: pytest -q
  smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -e ".[torch,bayes]" --extra-index-url https://download.pytorch.org/whl/cpu
      - run: make smoke
      - uses: actions/upload-artifact@v4
        with: { name: smoke-artifacts, path: artifacts/smoke/*.json }
