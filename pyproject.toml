[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "m5-forecast"
version = "0.1.0"
description = "Sales forecasting and price elasticity on the M5 (Walmart) dataset: LightGBM, PatchTST (PyTorch), DML and Bayesian hierarchical elasticity."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "duckdb>=0.10",
    "pyyaml>=6.0",
    "scikit-learn>=1.3",
    "lightgbm>=4.0",
    "scipy>=1.11",
]

[project.optional-dependencies]
torch = ["torch>=2.1"]
bayes = ["pymc>=5.10", "arviz>=0.17"]
dev = ["pytest>=7.4", "ruff>=0.4"]

[project.scripts]
m5 = "m5.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
